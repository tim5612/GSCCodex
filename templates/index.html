<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153c32"><title>商品標籤辨識</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;--green:#17664f;--ink:#183b32;--muted:#65766f;--line:#d5e1db;--soft:#edf4f0;--warn:#a15c00;--danger:#a5281e}*{box-sizing:border-box}body{margin:0;background:#e9efec;color:var(--ink);font-size:17px}button,input{font:inherit}button{border:0;cursor:pointer}.app{width:min(100%,560px);min-height:100dvh;margin:auto;background:#f8faf9}.topbar{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px;min-height:62px;padding:calc(10px + env(safe-area-inset-top)) 15px 10px;background:#fff;border-bottom:1px solid var(--line)}.topbar h1{font-size:20px;margin:0;flex:1}.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:800}.screen{display:none;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}.screen.active{display:block}.lead,.capture-help{margin:0 0 18px;color:var(--muted);line-height:1.55}.brand-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.brand-card{min-height:106px;padding:15px;text-align:left;border:1px solid var(--line);border-top:5px solid #87958e;border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 2px 8px #173b3109}.brand-card:active{transform:scale(.985)}.brand-name{display:block;font-size:20px;font-weight:800}.brand-note{display:block;margin-top:6px;color:var(--muted);font-size:14px;line-height:1.35}.brand-card[data-brand=lg]{border-top-color:#a50034}.brand-card[data-brand=panasonic]{border-top-color:#1356a2}.brand-card[data-brand=hitachi]{border-top-color:#df0011}.brand-card[data-brand=mitsubishi]{border-top-color:#e60012}.brand-card[data-brand=sony]{border-top-color:#111}.brand-card[data-brand=samsung]{border-top-color:#1428a0}.brand-card[data-brand=hawrin]{border-top-color:#5d377b}.selected-brand{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);font-weight:800;font-size:15px}.capture-title{margin:14px 0 5px;font-size:24px}.camera-shell{position:relative;overflow:hidden;border-radius:18px;background:#17201d;aspect-ratio:3/4;box-shadow:0 6px 24px #10251f25}.camera-shell video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;inset:0;pointer-events:none}.guide-frame{position:absolute;border:3px solid #8df0bd;border-radius:13px;box-shadow:0 0 0 999px #07110e72}.guide-zone{position:absolute;border:1px dashed #fff;background:#0e2c2259;color:#fff;font-size:12px;font-weight:800;padding:4px 6px;border-radius:6px}.guide.lg .guide-frame{left:7%;right:7%;top:32%;height:31%}.guide.lg .model-zone{left:10%;top:35%;width:43%;height:11%}.guide.lg .serial-zone{right:10%;top:35%;width:39%;height:12%}.guide.panasonic .guide-frame{right:8%;top:16%;width:43%;height:67%}.guide.panasonic .model-zone{right:11%;top:25%;width:37%;height:14%}.guide.panasonic .serial-zone{right:11%;top:48%;width:37%;height:16%}.guide.hitachi .guide-frame{left:12%;right:12%;top:26%;height:43%}.guide.hitachi .model-zone{left:15%;top:30%;width:55%;height:10%}.guide.hitachi .serial-zone{left:30%;top:47%;width:40%;height:13%}.guide.mitsubishi .guide-frame{right:13%;top:18%;width:48%;height:64%}.guide.mitsubishi .model-zone{right:16%;top:32%;width:42%;height:11%}.guide.mitsubishi .serial-zone{right:16%;top:47%;width:42%;height:11%}.guide.sony .guide-frame{left:8%;right:8%;top:20%;height:58%}.guide.sony .model-zone{left:11%;top:24%;width:78%;height:15%}.guide.sony .serial-zone{left:11%;top:51%;width:78%;height:16%}.guide.samsung .guide-frame{left:9%;right:9%;top:19%;height:61%}.guide.samsung .model-zone{right:12%;top:35%;width:38%;height:10%}.guide.samsung .serial-zone{left:12%;top:46%;width:76%;height:11%}.guide.hawrin .guide-frame,.guide.other .guide-frame{left:10%;right:10%;top:20%;height:60%}.guide.hawrin .model-zone,.guide.other .model-zone{left:13%;top:29%;width:74%;height:12%}.guide.hawrin .serial-zone,.guide.other .serial-zone{left:13%;top:48%;width:74%;height:13%}.camera-message{position:absolute;left:12px;right:12px;bottom:12px;padding:9px 12px;border-radius:10px;background:#07110ec7;color:#fff;text-align:center;font-size:14px}.camera-actions{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:9px;margin-top:13px}.action,.primary,.secondary{min-height:50px;border-radius:13px;padding:10px;font-weight:800}.action,.secondary{background:var(--soft);color:var(--green)}.shutter,.primary{background:var(--green);color:#fff}.action:disabled,.primary:disabled{opacity:.45}.tips{margin-top:14px;padding:13px 14px;border-radius:13px;background:#fff;border:1px solid var(--line)}.tips strong{display:block;margin-bottom:5px}.tips p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}.processing{display:none;position:absolute;inset:0;background:#0b1815d9;color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}.processing.show{display:flex}.spinner{width:38px;height:38px;border:4px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}@keyframes spin{to{transform:rotate(360deg)}}.review-photo{width:100%;max-height:260px;object-fit:contain;background:#e8eeeb;border-radius:15px;border:1px solid var(--line)}.evidence-note{margin:7px 0 20px;color:var(--muted);font-size:14px}.field{margin:0 0 18px}.field label{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin-bottom:7px}.field-label-hint{font-size:13px;color:var(--muted);font-weight:500}.field input{width:100%;min-height:52px;border:1px solid #adc0b6;border-radius:12px;background:#fff;padding:11px 13px;color:var(--ink);font:700 18px ui-monospace,Consolas,monospace}.field input:focus{outline:3px solid #55a98744;border-color:var(--green)}.field-status{font-size:14px;color:var(--muted);margin:6px 0 0}.field-status.warn{color:var(--warn)}.check{display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:12px;background:var(--soft);line-height:1.45}.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--green);flex:none}.primary,.secondary{width:100%;margin-top:10px}.error{display:none;margin:12px 0;padding:12px;border-radius:10px;background:#fff0ee;color:var(--danger)}.error.show{display:block}.result-card{text-align:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.result-card img{width:min(250px,78%);display:block;margin:10px auto}.result-grid{text-align:left;border-top:1px solid var(--line);margin-top:10px}.result-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1ef}.result-row span:last-child{font-family:ui-monospace,Consolas,monospace;text-align:right;word-break:break-all}.payload{margin-top:13px;padding:11px;border-radius:9px;background:var(--soft);font:15px/1.45 ui-monospace,Consolas,monospace;word-break:break-all;text-align:left}.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}@media(min-width:700px){.app{margin:20px auto;min-height:calc(100dvh - 40px);border-radius:21px;overflow:hidden;box-shadow:0 12px 40px #183b3218}}
.guide-frame-label{position:absolute;left:10px;top:9px;padding:4px 7px;border-radius:6px;background:#0e2c22bb;color:#fff;font-size:12px;font-weight:800}.guide-handle{position:absolute;width:28px;height:28px;border:3px solid #fff;border-radius:50%;background:var(--green);box-shadow:0 1px 6px #0008;pointer-events:auto;touch-action:none}.guide-handle[data-corner=nw]{left:-15px;top:-15px}.guide-handle[data-corner=ne]{right:-15px;top:-15px}.guide-handle[data-corner=sw]{left:-15px;bottom:-15px}.guide-handle[data-corner=se]{right:-15px;bottom:-15px}.crop-shell{position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;border-radius:16px;background:#17201d;touch-action:none}.crop-shell canvas{display:block;width:100%;height:100%}.crop-frame{position:absolute;left:8%;top:8%;width:84%;height:84%;border:3px solid #8df0bd;border-radius:12px;box-shadow:0 0 0 999px #07110e66;pointer-events:none}.crop-frame-label{position:absolute;left:10px;top:9px;padding:4px 7px;border-radius:6px;background:#0e2c22bb;color:#fff;font-size:13px;font-weight:800}.crop-handle{position:absolute;width:28px;height:28px;border:3px solid #fff;border-radius:50%;background:var(--green);box-shadow:0 1px 6px #0008;pointer-events:auto;touch-action:none}.crop-handle[data-corner=nw]{left:-15px;top:-15px}.crop-handle[data-corner=ne]{right:-15px;top:-15px}.crop-handle[data-corner=sw]{left:-15px;bottom:-15px}.crop-handle[data-corner=se]{right:-15px;bottom:-15px}.crop-gesture-hint{margin:9px 0 0;color:var(--muted);font-size:14px;text-align:center}.zoom-control{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:12px 2px 6px}.zoom-control input{width:100%;accent-color:var(--green)}.crop-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.crop-actions .secondary,.crop-actions .primary{margin-top:10px}
</style>
</head>
<body><div class="app">
<header class="topbar"><button id="backButton" class="icon-btn" type="button" hidden>←</button><h1 id="pageTitle">選擇商品品牌</h1><button id="changeBrand" class="icon-btn" type="button" hidden>⌁</button></header>
<main id="brandScreen" class="screen active"><p class="lead">先選品牌。每件商品只會執行一次型號 OCR；序號一律用實體一維條碼機輸入。</p><div id="brandGrid" class="brand-grid"></div></main>
<main id="captureScreen" class="screen"><span id="brandPill" class="selected-brand"></span><h2 id="captureTitle" class="capture-title"></h2><p id="captureHelp" class="capture-help"></p><div id="cameraShell" class="camera-shell"><video id="camera" autoplay playsinline muted></video><div id="guide" class="guide"><div id="cameraGuideFrame" class="guide-frame"><span class="guide-frame-label">型號辨識範圍</span><i class="guide-handle" data-corner="nw"></i><i class="guide-handle" data-corner="ne"></i><i class="guide-handle" data-corner="sw"></i><i class="guide-handle" data-corner="se"></i></div></div><div id="cameraMessage" class="camera-message">正在啟動相機…</div><div id="processing" class="processing"><div class="spinner"></div>正在保存照片並辨識型號一次…</div></div><div class="camera-actions"><button id="albumButton" class="action" type="button">相簿</button><button id="captureButton" class="action shutter" type="button" disabled>拍攝型號</button><button id="flipButton" class="action" type="button">翻轉</button></div><p class="crop-gesture-hint">拖曳綠框四角可調整拍攝辨識範圍</p><div class="tips"><strong id="tipTitle"></strong><p id="tipText"></p></div><div id="captureError" class="error"></div></main>
<main id="cropScreen" class="screen"><span id="cropBrand" class="selected-brand"></span><h2 class="capture-title">調整型號辨識範圍</h2><p class="capture-help">單指移動照片、雙指縮放；拖曳綠框四角可調整寬度與高度。</p><div id="cropShell" class="crop-shell"><canvas id="cropCanvas" width="1200" height="900"></canvas><div id="cropFrame" class="crop-frame"><span class="crop-frame-label">型號辨識範圍</span><i class="crop-handle" data-corner="nw"></i><i class="crop-handle" data-corner="ne"></i><i class="crop-handle" data-corner="sw"></i><i class="crop-handle" data-corner="se"></i></div></div><p class="crop-gesture-hint">單指拖曳照片 · 雙指縮放 · 拖曳圓點調整綠框</p><label class="zoom-control" for="cropZoom"><span>縮小</span><input id="cropZoom" type="range" min="1" max="4" value="1" step="0.01"><span>放大</span></label><div id="cropError" class="error"></div><div class="crop-actions"><button id="cancelCrop" class="secondary" type="button">重新選圖</button><button id="confirmCrop" class="primary" type="button">使用這個範圍</button></div></main>
<main id="reviewScreen" class="screen"><span id="reviewBrand" class="selected-brand"></span><h2 class="capture-title">核對型號並掃描序號</h2><p class="capture-help">請先確認 OCR 型號，再用實體一維條碼機輸入序號。</p><img id="reviewPhoto" class="review-photo" alt="校正後的型號照片"><p class="evidence-note">照片只用來辨識一次機器型號，不會辨識序號。</p><div class="field"><label for="model"><span>機器型號 *</span><span id="modelHint" class="field-label-hint"></span></label><input id="model" autocomplete="off" autocapitalize="characters" spellcheck="false"><p id="modelStatus" class="field-status"></p></div><div class="field"><label for="serial"><span>序號（一維條碼）*</span><span class="field-label-hint">實體條碼機輸入</span></label><input id="serial" autocomplete="off" autocapitalize="characters" spellcheck="false"><p id="serialStatus" class="field-status warn">此欄不使用 OCR，請用實體條碼機掃描。</p></div><div class="field"><label for="entryDate">入庫日期 *</label><input id="entryDate" type="date"></div><label class="check"><input id="confirmed" type="checkbox"><span>我已確認機器型號，並已用實體條碼機輸入序號。</span></label><div id="reviewError" class="error"></div><button id="createQr" class="primary" type="button">確認並產生 QR Code</button><button id="retakeButton" class="secondary" type="button">重新拍攝</button></main>
<main id="resultScreen" class="screen"><div class="result-card"><h2>商品 QR Code</h2><img id="qrImage" alt="商品 QR Code"><div class="result-grid"><div class="result-row"><span>品牌</span><span id="resultBrand"></span></div><div class="result-row"><span>機器型號</span><span id="resultModel"></span></div><div class="result-row"><span>序號</span><span id="resultSerial"></span></div><div class="result-row"><span>日期</span><span id="resultDate"></span></div></div><div id="payload" class="payload"></div><a id="downloadQr" class="primary" style="display:block;text-decoration:none;padding:14px" download="product-qr.png">下載 QR Code</a></div><button id="nextSameBrand" class="primary" type="button">同品牌下一件</button><button id="nextBrand" class="secondary" type="button">改選品牌</button></main>
<input id="photoInput" class="hidden-file" type="file" accept="image/*,.heic,.heif"><canvas id="captureCanvas" hidden></canvas>
</div>
<script>
const brands={lg:{name:'LG',title:'拍攝 LG 型號',help:'讓型號文字清楚落在取景框內，只會進行一次型號 OCR。',tip:'對準標籤上的型號；序號稍後使用實體條碼機輸入。',mh:'型號'},panasonic:{name:'Panasonic',title:'拍攝 Panasonic 型號',help:'讓「機種名稱」清楚落在取景框內，只會進行一次型號 OCR。',tip:'只需拍清楚機種名稱；製造號碼稍後使用實體條碼機輸入。',mh:'機種名稱'},hitachi:{name:'Hitachi',title:'拍攝 Hitachi 型號',help:'讓產品型號清楚落在取景框內，只會進行一次型號 OCR。',tip:'對準型號文字，不需拍攝或辨識製造番号。',mh:'產品型號'},mitsubishi:{name:'Mitsubishi',title:'拍攝 Mitsubishi 型號',help:'讓 MODEL 文字清楚落在取景框內，只會進行一次型號 OCR。',tip:'只需對準 MODEL；SERIAL 稍後使用實體條碼機輸入。',mh:'MODEL'},sony:{name:'Sony',title:'拍攝 Sony 型號',help:'讓型號／機型文字清楚落在取景框內，只會進行一次型號 OCR。',tip:'只需拍清楚型號；機號稍後使用實體條碼機輸入。',mh:'型號／機型'},samsung:{name:'Samsung',title:'拍攝 Samsung 型號',help:'讓 Model Code／Model No. 清楚落在取景框內，只會進行一次型號 OCR。',tip:'只需對準 Model Code；S/N 稍後使用實體條碼機輸入。',mh:'Model Code'},hawrin:{name:'HAWRIN／華菱',title:'拍攝華菱型號',help:'讓紙箱或標籤上的型號大字清楚落在取景框內，只會進行一次型號 OCR。',tip:'只需拍清楚型號；製造編號稍後使用實體條碼機輸入。',mh:'產品型號'},other:{name:'其他品牌',title:'拍攝產品型號',help:'讓 Model／型號文字清楚落在取景框內，只會進行一次型號 OCR。',tip:'只辨識產品型號；序號稍後使用實體條碼機輸入。',mh:'Model／型號'}};
const state={brand:null,stream:null,facing:'environment',captureId:null,ocrModel:'',inputMethod:'manual',crop:null};const $=id=>document.getElementById(id),screens=['brandScreen','captureScreen','cropScreen','reviewScreen','resultScreen'];const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('entryDate').value=today;
function showScreen(id,title){screens.forEach(x=>$(x).classList.toggle('active',x===id));$('pageTitle').textContent=title;$('backButton').hidden=id==='brandScreen'||id==='resultScreen';$('changeBrand').hidden=id==='brandScreen'||id==='resultScreen';window.scrollTo({top:0})}function err(id,m){$(id).textContent=m;$(id).classList.toggle('show',!!m)}
Object.entries(brands).forEach(([key,b])=>{const x=document.createElement('button');x.className='brand-card';x.dataset.brand=key;x.innerHTML=`<span class="brand-name"></span><span class="brand-note"></span>`;x.children[0].textContent=b.name;x.children[1].textContent=b.mh+'（只辨識一次）';x.onclick=()=>selectBrand(key);$('brandGrid').append(x)});
function resetCameraGuide(){const f=$('cameraGuideFrame');f.style.left=f.style.top=f.style.width=f.style.height=f.style.right=f.style.bottom=''}
async function selectBrand(key){state.brand=key;const b=brands[key];$('brandPill').textContent=$('reviewBrand').textContent=b.name;$('captureTitle').textContent=b.title;$('captureHelp').textContent=b.help;$('tipTitle').textContent=b.name+' 拍攝重點';$('tipText').textContent=b.tip;$('modelHint').textContent=b.mh;$('guide').className='guide '+key;resetCameraGuide();showScreen('captureScreen',b.name+' 型號辨識');await startCamera()}
function stopCamera(){if(state.stream)state.stream.getTracks().forEach(t=>t.stop());state.stream=null;$('camera').srcObject=null}async function startCamera(){stopCamera();err('captureError','');$('cameraMessage').hidden=false;$('cameraMessage').textContent='正在啟動相機…';$('captureButton').disabled=true;try{state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.facing},width:{ideal:1920},height:{ideal:2560}},audio:false});$('camera').srcObject=state.stream;await $('camera').play();$('captureButton').disabled=false;$('cameraMessage').textContent='對準標籤後拍攝';setTimeout(()=>$('cameraMessage').hidden=true,1600)}catch(e){$('cameraMessage').textContent='請使用相簿或檢查相機權限';err('captureError','相機未啟動：'+e.message)}}
async function capturePhoto(){const v=$('camera'),c=$('captureCanvas'),shell=$('cameraShell').getBoundingClientRect(),frame=$('cameraGuideFrame').getBoundingClientRect();if(!v.videoWidth)return;const scale=Math.max(shell.width/v.videoWidth,shell.height/v.videoHeight),renderedWidth=v.videoWidth*scale,renderedHeight=v.videoHeight*scale,sourceX=Math.max(0,(frame.left-shell.left+(renderedWidth-shell.width)/2)/scale),sourceY=Math.max(0,(frame.top-shell.top+(renderedHeight-shell.height)/2)/scale),sourceWidth=Math.min(v.videoWidth-sourceX,frame.width/scale),sourceHeight=Math.min(v.videoHeight-sourceY,frame.height/scale);c.width=Math.max(1,Math.round(sourceWidth));c.height=Math.max(1,Math.round(sourceHeight));c.getContext('2d').drawImage(v,sourceX,sourceY,sourceWidth,sourceHeight,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.94));await submitPhoto(new File([blob],'capture-model.jpg',{type:'image/jpeg'}))}
async function prepare(file){try{const bmp=await createImageBitmap(file),max=2400,s=Math.min(1,max/Math.max(bmp.width,bmp.height));if(s===1){bmp.close();return file}const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));return new File([blob],'upload.jpg',{type:'image/jpeg'})}catch{return file}}
function closeCrop(){if(state.crop?.url)URL.revokeObjectURL(state.crop.url);state.crop=null;err('cropError','')}
function syncCropFrame(){const f=state.crop?.frame;if(!f)return;const el=$('cropFrame');el.style.left=f.x*100+'%';el.style.top=f.y*100+'%';el.style.width=f.w*100+'%';el.style.height=f.h*100+'%'}
function drawCrop(){const s=state.crop;if(!s)return;const c=$('cropCanvas'),ctx=c.getContext('2d'),scale=s.base*Number($('cropZoom').value),dw=s.image.naturalWidth*scale,dh=s.image.naturalHeight*scale,maxX=Math.max(0,(dw-c.width)/2),maxY=Math.max(0,(dh-c.height)/2);s.x=Math.max(-maxX,Math.min(maxX,s.x));s.y=Math.max(-maxY,Math.min(maxY,s.y));ctx.fillStyle='#17201d';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(s.image,(c.width-dw)/2+s.x,(c.height-dh)/2+s.y,dw,dh)}
async function openCrop(file){closeCrop();const image=new Image(),url=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('手機瀏覽器無法預覽這張照片'));image.src=url});const c=$('cropCanvas');state.crop={file,image,url,base:Math.max(c.width/image.naturalWidth,c.height/image.naturalHeight),x:0,y:0,lastX:0,lastY:0,pointers:new Map(),pinch:null,resize:null,frame:{x:.08,y:.08,w:.84,h:.84}};$('cropZoom').value='1';$('cropBrand').textContent=brands[state.brand].name;stopCamera();showScreen('cropScreen',brands[state.brand].name+' · 調整照片');syncCropFrame();drawCrop()}catch(e){URL.revokeObjectURL(url);err('captureError',e.message)}}
async function submitPhoto(file){$('processing').classList.add('show');err('captureError','');try{const form=new FormData();form.append('image',await prepare(file));form.append('brand',state.brand);form.append('modelCrop','1');const res=await fetch('/api/analyze',{method:'POST',body:form}),d=await res.json();if(!res.ok)throw new Error(d.error||'照片處理失敗');state.captureId=d.captureId;state.ocrModel=d.model||'';state.inputMethod=d.model?'ocr':'manual';$('reviewPhoto').src=d.imageUrls.rectified;$('model').value=d.model||'';$('serial').value='';$('modelStatus').textContent=d.model?(d.ocrError||`型號 OCR 信心值 ${(d.confidence*100).toFixed(1)}%，請逐字核對`):(d.ocrError||'未取得可靠型號，請依照片輸入');$('modelStatus').className='field-status '+(d.model?'':'warn');$('serialStatus').textContent='此欄不使用 OCR，請用實體條碼機掃描。';$('confirmed').checked=false;stopCamera();showScreen('reviewScreen',brands[state.brand].name+' · 核對型號');setTimeout(()=>$(d.model?'serial':'model').focus(),0)}catch(e){err('captureError',e.message)}finally{$('processing').classList.remove('show')}}
function reset(){state.captureId=null;state.ocrModel='';state.inputMethod='manual';$('model').value=$('serial').value='';$('confirmed').checked=false;$('entryDate').value=today;err('reviewError','')}
$('captureButton').onclick=capturePhoto;$('albumButton').onclick=()=>$('photoInput').click();$('photoInput').onchange=async()=>{const f=$('photoInput').files[0];$('photoInput').value='';if(f)await openCrop(f)};$('cropZoom').oninput=drawCrop;$('cropShell').onpointerdown=e=>{if(e.target.closest('.crop-handle'))return;const s=state.crop;if(!s)return;s.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});e.currentTarget.setPointerCapture(e.pointerId);if(s.pointers.size===1){s.lastX=e.clientX;s.lastY=e.clientY;s.pinch=null}else if(s.pointers.size===2){const p=[...s.pointers.values()],distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);s.pinch={distance,zoom:Number($('cropZoom').value)}}};$('cropShell').onpointermove=e=>{const s=state.crop;if(!s||!s.pointers.has(e.pointerId))return;s.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(s.pointers.size>=2&&s.pinch){const p=[...s.pointers.values()],distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom=Math.max(1,Math.min(4,s.pinch.zoom*distance/Math.max(1,s.pinch.distance)));$('cropZoom').value=String(zoom);drawCrop()}else if(s.pointers.size===1){const rect=$('cropCanvas').getBoundingClientRect();s.x+=(e.clientX-s.lastX)*$('cropCanvas').width/rect.width;s.y+=(e.clientY-s.lastY)*$('cropCanvas').height/rect.height;s.lastX=e.clientX;s.lastY=e.clientY;drawCrop()}};$('cropShell').onpointerup=$('cropShell').onpointercancel=e=>{const s=state.crop;if(!s)return;s.pointers.delete(e.pointerId);s.pinch=null;const remaining=[...s.pointers.values()][0];if(remaining){s.lastX=remaining.x;s.lastY=remaining.y}};document.querySelectorAll('.crop-handle').forEach(handle=>{handle.onpointerdown=e=>{e.stopPropagation();const s=state.crop;if(!s)return;handle.setPointerCapture(e.pointerId);s.resize={id:e.pointerId,corner:handle.dataset.corner,startX:e.clientX,startY:e.clientY,frame:{...s.frame}}};handle.onpointermove=e=>{const s=state.crop,r=s?.resize;if(!r||r.id!==e.pointerId)return;const rect=$('cropShell').getBoundingClientRect(),dx=(e.clientX-r.startX)/rect.width,dy=(e.clientY-r.startY)/rect.height,min=.15,f=r.frame;let left=f.x,top=f.y,right=f.x+f.w,bottom=f.y+f.h;if(r.corner.includes('w'))left=Math.max(.01,Math.min(right-min,f.x+dx));if(r.corner.includes('e'))right=Math.min(.99,Math.max(left+min,f.x+f.w+dx));if(r.corner.includes('n'))top=Math.max(.01,Math.min(bottom-min,f.y+dy));if(r.corner.includes('s'))bottom=Math.min(.99,Math.max(top+min,f.y+f.h+dy));s.frame={x:left,y:top,w:right-left,h:bottom-top};syncCropFrame()};handle.onpointerup=handle.onpointercancel=e=>{if(state.crop?.resize?.id===e.pointerId)state.crop.resize=null}});$('cancelCrop').onclick=()=>{closeCrop();showScreen('captureScreen',brands[state.brand].name+' 型號辨識');$('photoInput').click()};$('confirmCrop').onclick=async()=>{const source=$('cropCanvas'),f=state.crop?.frame;if(!f)return;const out=document.createElement('canvas'),sx=Math.round(source.width*f.x),sy=Math.round(source.height*f.y);out.width=Math.max(1,Math.round(source.width*f.w));out.height=Math.max(1,Math.round(source.height*f.h));out.getContext('2d').drawImage(source,sx,sy,out.width,out.height,0,0,out.width,out.height);const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',.94));if(!blob)return err('cropError','無法裁切這張照片，請重新選圖');const file=new File([blob],'cropped-model.jpg',{type:'image/jpeg'});closeCrop();showScreen('captureScreen',brands[state.brand].name+' 型號辨識');await submitPhoto(file)};$('flipButton').onclick=async()=>{state.facing=state.facing==='environment'?'user':'environment';await startCamera()};$('backButton').onclick=()=>{if($('cropScreen').classList.contains('active')){closeCrop();showScreen('captureScreen',brands[state.brand].name+' 型號辨識');startCamera()}else if($('reviewScreen').classList.contains('active')){reset();showScreen('captureScreen',brands[state.brand].name+' 型號辨識');startCamera()}else{stopCamera();showScreen('brandScreen','選擇商品品牌')}};$('changeBrand').onclick=()=>{stopCamera();closeCrop();reset();showScreen('brandScreen','選擇商品品牌')};$('retakeButton').onclick=()=>{reset();showScreen('captureScreen',brands[state.brand].name+' 型號辨識');startCamera()};$('model').oninput=()=>{if($('model').value.trim()!==state.ocrModel)state.inputMethod='manual'};
document.querySelectorAll('.guide-handle').forEach(handle=>{handle.onpointerdown=e=>{e.stopPropagation();const shell=$('cameraShell').getBoundingClientRect(),frame=$('cameraGuideFrame').getBoundingClientRect(),f={x:(frame.left-shell.left)/shell.width,y:(frame.top-shell.top)/shell.height,w:frame.width/shell.width,h:frame.height/shell.height};handle.setPointerCapture(e.pointerId);state.cameraResize={id:e.pointerId,corner:handle.dataset.corner,startX:e.clientX,startY:e.clientY,frame:f};const el=$('cameraGuideFrame');el.style.left=f.x*100+'%';el.style.top=f.y*100+'%';el.style.width=f.w*100+'%';el.style.height=f.h*100+'%';el.style.right='auto';el.style.bottom='auto'};handle.onpointermove=e=>{const r=state.cameraResize;if(!r||r.id!==e.pointerId)return;const rect=$('cameraShell').getBoundingClientRect(),dx=(e.clientX-r.startX)/rect.width,dy=(e.clientY-r.startY)/rect.height,min=.15,f=r.frame;let left=f.x,top=f.y,right=f.x+f.w,bottom=f.y+f.h;if(r.corner.includes('w'))left=Math.max(.01,Math.min(right-min,f.x+dx));if(r.corner.includes('e'))right=Math.min(.99,Math.max(left+min,f.x+f.w+dx));if(r.corner.includes('n'))top=Math.max(.01,Math.min(bottom-min,f.y+dy));if(r.corner.includes('s'))bottom=Math.min(.99,Math.max(top+min,f.y+f.h+dy));const el=$('cameraGuideFrame');el.style.left=left*100+'%';el.style.top=top*100+'%';el.style.width=(right-left)*100+'%';el.style.height=(bottom-top)*100+'%'};handle.onpointerup=handle.onpointercancel=e=>{if(state.cameraResize?.id===e.pointerId)state.cameraResize=null}});
$('createQr').onclick=async()=>{err('reviewError','');const model=$('model').value.trim(),serial=$('serial').value.trim();if(!model)return err('reviewError','請輸入或確認機器型號');if(!serial)return err('reviewError','請用實體條碼機掃描序號');if(!$('entryDate').value)return err('reviewError','請選擇入庫日期');if(!$('confirmed').checked)return err('reviewError','請先勾選已確認型號及條碼序號');$('createQr').disabled=true;try{const res=await fetch('/api/create-qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({captureId:state.captureId,brand:state.brand,model,serialNumber:serial,date:$('entryDate').value,inputMethod:state.inputMethod})}),d=await res.json();if(!res.ok)throw new Error(d.error||'QR Code 產生失敗');$('qrImage').src=d.qrUrl;$('downloadQr').href=d.qrUrl;$('resultBrand').textContent=brands[state.brand].name;$('resultModel').textContent=d.record.model;$('resultSerial').textContent=d.record.serialNumber;$('resultDate').textContent=d.record.date;$('payload').textContent=d.payload;showScreen('resultScreen','完成')}catch(e){err('reviewError',e.message)}finally{$('createQr').disabled=false}};$('nextSameBrand').onclick=()=>{reset();showScreen('captureScreen',brands[state.brand].name+' 型號辨識');startCamera()};$('nextBrand').onclick=()=>{reset();showScreen('brandScreen','選擇商品品牌')};
</script></body></html>
