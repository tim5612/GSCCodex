<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>商品 QR Code 測試</title>
  <style>
    :root{font-family:system-ui,"Microsoft JhengHei",sans-serif;--green:#17664f;--ink:#173b31;--muted:#64776f;--line:#d9e4de;--soft:#eef4f0}*{box-sizing:border-box}body{margin:0;background:#eef3f0;color:var(--ink);font-size:17px}button,input{font:inherit;font-size:17px}button{min-height:48px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.app{width:min(100%,560px);min-height:100vh;margin:auto;background:#f9fbfa}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 18px 14px}h1{margin:0;font-size:22px}h2{font-size:21px;margin:0 0 8px}main{padding:20px 16px calc(30px + env(safe-area-inset-bottom))}.intro,.help{color:var(--muted);line-height:1.55}.intro{margin:0 0 20px;font-size:16px}.field{margin-bottom:22px}label,.field-label{display:block;font-weight:700;margin-bottom:8px}.required{color:#b42318}.input-row{display:grid;grid-template-columns:1fr auto;gap:8px}input{width:100%;min-height:50px;border:1px solid #aec1b7;border-radius:11px;background:#fff;padding:11px 13px;color:var(--ink)}input:focus{outline:3px solid #68a98f55;border-color:var(--green)}input:disabled{background:#edf1ef;color:#7a8982}.action{background:var(--soft);color:var(--green);border:1px solid #acc4b8;white-space:nowrap}.primary{width:100%;background:var(--green);color:#fff}.secondary{width:100%;background:var(--soft);color:var(--green);margin-top:9px}.status{margin:8px 0 0;font-size:15px;color:var(--muted)}.status.ok{color:#16704f}.preview{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.preview.show{display:block}.preview img{display:block;width:100%;max-height:250px;object-fit:contain;background:#edf1ef;border-radius:9px}.check{display:flex;gap:11px;align-items:flex-start;font-weight:400;line-height:1.5;padding:12px 0}.check input{width:22px;min-height:22px;height:22px;margin:2px 0 0;accent-color:var(--green);flex:none}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:20px}.date-row{grid-template-columns:1fr}.error{display:none;color:#a3261a;background:#fef0ee;border-radius:10px;padding:12px;margin:12px 0}.error.show{display:block}.processing{display:none;text-align:center;padding:24px 10px;color:var(--muted)}.processing.show{display:block}.spinner{width:34px;height:34px;margin:0 auto 12px;border:4px solid #dce8e2;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.sheet-backdrop{display:none;position:fixed;inset:0;z-index:10;background:#102a2288;padding:18px;align-items:flex-end;justify-content:center}.sheet-backdrop.show{display:flex}.sheet{width:min(100%,540px);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}.sheet-image{width:100%;max-height:280px;object-fit:contain;background:#edf1ef;border-radius:11px;margin:12px 0}.recognized{font:700 25px/1.3 ui-monospace,Consolas,monospace;padding:13px;border:1px solid #a9c2b6;border-radius:10px;word-break:break-all}.confidence{font-size:15px;color:var(--muted);margin:8px 0 16px}.qr-result{display:none;text-align:center}.qr-result.show{display:block}.qr-result img{width:min(250px,80%);margin:8px auto 16px;display:block;image-rendering:pixelated}.data-list{text-align:left;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.data-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.data-row span:last-child{font-family:ui-monospace,Consolas,monospace;text-align:right;word-break:break-all}.payload{background:var(--soft);border-radius:9px;padding:11px;font:16px/1.45 ui-monospace,Consolas,monospace;word-break:break-all;text-align:left}.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}@media(min-width:700px){.app{margin:24px auto;min-height:auto;border-radius:20px;overflow:hidden;box-shadow:0 8px 35px #173b3114}}
    body .intro, body .help, body .status, body .confidence, body .payload { font-size:17px; }
  </style>
</head>
<body>
<div class="app">
  <header><h1>建立商品 QR Code</h1></header>
  <main>
    <p class="intro">標籤照片必須保存。商品型號可以使用 OCR 結果，也可以拍照後改用掃碼或人工輸入。</p>
    <section id="entrySection">
      <div class="field">
        <span class="field-label">商品型號 <span class="required">*</span></span>
        <div class="input-row"><input id="model" type="text" placeholder="先點 OCR 拍攝標籤" disabled autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="ocrButton" class="action" type="button">OCR</button></div>
        <p id="modelStatus" class="status">尚未拍照</p>
        <div id="photoPreview" class="preview"><img id="rectifiedPreview" alt="梯形校正後的標籤照片"><p class="status ok">✓ 原始照片與梯形校正圖已存至伺服器</p></div>
        <label id="photoConfirmWrap" class="check" hidden><input id="photoConfirmed" type="checkbox"><span>我已對照照片，確認商品型號正確</span></label>
      </div>
      <div class="field"><label for="serial">S/NO <span class="required">*</span></label><div class="input-row"><input id="serial" type="text" placeholder="輸入或使用條碼掃描器" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="focusSerial" class="action" type="button">掃碼</button></div><p class="status">條碼掃描器可直接將內容帶入此欄位。</p></div>
      <div class="field"><label for="entryDate">日期 <span class="required">*</span></label><div class="input-row date-row"><input id="entryDate" type="date"></div></div>
      <div id="error" class="error" role="alert"></div><button id="createQr" class="primary" type="button">產生 QR Code</button>
    </section>
    <section id="qrResult" class="card qr-result" aria-live="polite"><h2>商品 QR Code</h2><img id="qrImage" alt="商品 QR Code"><div class="data-list"><div class="data-row"><span>商品型號</span><span id="resultModel"></span></div><div class="data-row"><span>S/NO</span><span id="resultSerial"></span></div><div class="data-row"><span>日期</span><span id="resultDate"></span></div></div><div id="payload" class="payload"></div><a id="downloadQr" class="primary" style="display:block;text-decoration:none;padding:13px;border-radius:12px;margin-top:15px" download="product-qr.png">下載 QR Code</a><button id="nextItem" class="secondary" type="button">建立下一件</button></section>
    <input id="photoInput" class="hidden-file" type="file" accept="image/*" capture="environment">
  </main>
</div>
<div id="ocrSheet" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="ocrTitle"><div class="sheet"><h2 id="ocrTitle">OCR 辨識商品型號</h2><p class="help">請對照校正後的標籤照片，確認每一個字元。</p><div id="ocrProcessing" class="processing"><div class="spinner"></div>伺服器正在校正標籤並辨識文字…</div><div id="ocrContent" hidden><img id="sheetImage" class="sheet-image" alt="梯形校正後的標籤照片"><span class="field-label">OCR 辨識結果</span><div id="recognizedModel" class="recognized"></div><p id="ocrMeta" class="confidence"></p><button id="useOcr" class="primary" type="button">使用此 OCR 結果</button><button id="useDirect" class="secondary" type="button">改用掃碼／人工輸入</button><button id="retake" class="secondary" type="button">重新拍照</button></div></div></div>
<script>
const state={captureId:null,inputMethod:null,ocrModel:''},$=id=>document.getElementById(id);const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('entryDate').value=today;
function showError(m){$('error').textContent=m;$('error').classList.toggle('show',Boolean(m))}function openSheet(){$('ocrSheet').classList.add('show')}function closeSheet(){$('ocrSheet').classList.remove('show')}
function markPhotoSaved(d){state.captureId=d.captureId;state.ocrModel=d.model||'';$('rectifiedPreview').src=d.imageUrls.rectified;$('sheetImage').src=d.imageUrls.rectified;$('photoPreview').classList.add('show');$('photoConfirmWrap').hidden=false;$('photoConfirmed').checked=false;$('model').disabled=false;$('modelStatus').textContent=`✓ 照片已保存，伺服器處理 ${(d.processingMs/1000).toFixed(1)} 秒`;$('modelStatus').className='status ok'}
async function prepareUpload(file){if(!file.type.startsWith('image/'))return file;const bitmap=await createImageBitmap(file);const maxSide=2200,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));if(scale===1){bitmap.close();return file}const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.9));return new File([blob],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'})}
$('ocrButton').onclick=()=>$('photoInput').click();$('retake').onclick=()=>{closeSheet();$('photoInput').click()};$('focusSerial').onclick=()=>$('serial').focus();
$('photoInput').onchange=async()=>{const file=$('photoInput').files[0];if(!file)return;openSheet();$('ocrProcessing').classList.add('show');$('ocrContent').hidden=true;showError('');try{const upload=await prepareUpload(file),form=new FormData();form.append('image',upload);const response=await fetch('/api/analyze',{method:'POST',body:form}),data=await response.json();if(!response.ok)throw new Error(data.error||'照片處理失敗');markPhotoSaved(data);$('recognizedModel').textContent=data.model||'未取得可靠的型號';$('ocrMeta').textContent=(data.ocrError||`OCR 信心值 ${(data.confidence*100).toFixed(1)}%`)+` · 伺服器 ${data.processingMs} ms`;$('useOcr').disabled=!data.model;$('ocrContent').hidden=false}catch(error){closeSheet();showError(error.message)}finally{$('ocrProcessing').classList.remove('show');$('photoInput').value=''}};
$('useOcr').onclick=()=>{$('model').value=state.ocrModel;state.inputMethod='ocr';$('modelStatus').textContent='✓ 已使用 OCR 結果，請對照照片確認';closeSheet();$('photoConfirmed').focus()};
$('useDirect').onclick=()=>{$('model').value='';state.inputMethod='manual';$('modelStatus').textContent='✓ 照片已保存，請掃碼或直接輸入商品型號';closeSheet();$('model').focus()};
$('model').oninput=()=>{if(state.inputMethod==='ocr'&&$('model').value!==state.ocrModel)state.inputMethod='manual'};
$('createQr').onclick=async()=>{showError('');if(!state.captureId)return showError('請先點 OCR 拍攝並保存標籤照片');if(!$('model').value.trim())return showError('請取得或輸入商品型號');if(!$('photoConfirmed').checked)return showError('請對照照片並確認商品型號');if(!$('serial').value.trim())return showError('請輸入或掃描 S/NO');if(!$('entryDate').value)return showError('請選擇日期');$('createQr').disabled=true;$('createQr').textContent='產生中…';try{const response=await fetch('/api/create-qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({captureId:state.captureId,model:$('model').value.trim(),serialNumber:$('serial').value.trim(),date:$('entryDate').value,inputMethod:state.inputMethod||'manual'})}),data=await response.json();if(!response.ok)throw new Error(data.error||'QR Code 產生失敗');$('qrImage').src=data.qrUrl;$('downloadQr').href=data.qrUrl;$('resultModel').textContent=data.record.model;$('resultSerial').textContent=data.record.serialNumber;$('resultDate').textContent=data.record.date;$('payload').textContent=data.payload;$('entrySection').hidden=true;$('qrResult').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}catch(error){showError(error.message)}finally{$('createQr').disabled=false;$('createQr').textContent='產生 QR Code'}};
$('nextItem').onclick=()=>{state.captureId=null;state.inputMethod=null;state.ocrModel='';$('model').value='';$('model').disabled=true;$('serial').value='';$('entryDate').value=today;$('photoConfirmed').checked=false;$('photoConfirmWrap').hidden=true;$('photoPreview').classList.remove('show');$('modelStatus').textContent='尚未拍照';$('modelStatus').className='status';$('qrResult').classList.remove('show');$('entrySection').hidden=false;showError('');window.scrollTo({top:0,behavior:'smooth'})};
</script>
</body>
</html>
